<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WMAP · Welding Management</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--line:#dde3ea;--txt:#1d2733;--mut:#6b7785;--acc:#1f5fbf;--acc2:#e8f0fc;--ok:#1b8a4b;--warn:#c77d00;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
#app{display:flex;min-height:100vh}
nav{width:210px;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h1{font-size:18px;margin:0 6px 2px;color:var(--acc)}
nav small{display:block;margin:0 6px 14px;color:var(--mut)}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 8px 4px}
nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--txt);text-decoration:none;cursor:pointer}
nav a:hover{background:var(--bg)} nav a.on{background:var(--acc2);color:var(--acc);font-weight:600}
main{flex:1;padding:20px 24px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px;flex:1}
.demo{background:#fff6e0;border:1px solid #f0d58a;color:#7a5a00;padding:6px 10px;border-radius:6px;font-size:12px;margin-bottom:12px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--txt);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover{background:var(--bg)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff} button.pri:hover{background:#184c99}
button.del{color:var(--bad)} button.sm{padding:2px 8px;font-size:12px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
input[type=checkbox]{width:auto}
.search{max-width:260px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f0f3f7;font-size:12px;color:var(--mut);position:sticky;top:0}
tr:hover td{background:#fafcff}
td.act{text-align:right;width:1%}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eef1f5}
.b-aprobado,.b-ok{background:#e0f4e8;color:var(--ok)} .b-borrador,.b-warn{background:#fff1d6;color:var(--warn)}
.b-obsoleto,.b-bad,.b-error,.b-vencida,.b-critica{background:#fbe3e0;color:var(--bad)} .b-aviso,.b-proxima{background:#fff1d6;color:var(--warn)} .b-revisado{background:var(--acc2);color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.kpi b{display:block;font-size:26px;color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:20}
.modal.hidden{display:none}
.box{background:#fff;border-radius:10px;width:min(920px,100%);padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.box h3{margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.grid label{display:block;font-size:12px;color:var(--mut)} .grid label.w2{grid-column:span 2} .grid label.wall{grid-column:1/-1}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;border:1px solid var(--line);border-radius:6px;padding:8px;max-height:140px;overflow:auto;font-size:13px;color:var(--txt)}
.chk label{display:flex;gap:5px;align-items:center;color:var(--txt);font-size:13px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.sug{margin-top:10px;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px}
.sug div{padding:4px 6px;border-radius:4px;cursor:pointer} .sug div:hover{background:var(--acc2)}
.login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}
.login input{margin-bottom:10px}
.toast{position:fixed;bottom:18px;right:18px;background:#1d2733;color:#fff;padding:10px 14px;border-radius:8px;z-index:50;max-width:380px}
.toast.err{background:var(--bad)}
.croquis{position:relative;display:inline-block;border:1px solid var(--line);background:#fff;max-width:100%}
.croquis img{display:block;max-width:100%;max-height:560px}
.pin{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1.5px solid #111;border-radius:50%;min-width:22px;height:22px;line-height:19px;text-align:center;font-size:11px;font-weight:700;color:#111;padding:0 3px}
.hint{color:var(--mut);font-size:12px}
#print{display:none}
.hdr{display:flex;align-items:center;gap:10px;border-bottom:1px solid #444;margin-bottom:6px;padding-bottom:4px}.hdr img{height:30px}.hdr span{margin-left:auto;font-size:11px}
.caj{position:absolute;left:0;right:0;bottom:0}.caj table{font-size:8px;width:100%}.pie{font-size:7px;color:#555;margin-top:2px}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body>#app,.modal,.toast{display:none!important}
  #print{display:block;color:#000;background:#fff} body{background:#fff}
  .pg{page-break-after:always;padding:2mm;height:184mm;position:relative;overflow:hidden}
  .pg:last-child{page-break-after:auto}
  .pg h1{font-size:20px;margin:0 0 8px} .pg h2{font-size:14px;margin:0 0 6px}
  .pg table{font-size:9px} .pg th,.pg td{border:1px solid #888;padding:3px 5px;white-space:normal;position:static;background:#fff}
  .pg th{background:#e9e9e9;color:#000}
  .pg .meta td:first-child{font-weight:700;background:#e9e9e9;width:34%}
  .pg .croquis{border:1px solid #888;max-width:100%}
  .pg .croquis img{max-height:120mm}
  .cover td{font-size:12px;padding:6px 8px}
}
</style>
</head>
<body>
<div id="login" class="login" style="display:none">
  <h1 style="margin:0 0 4px;color:#1f5fbf">WMAP</h1>
  <div class="hint" style="margin-bottom:14px">Welding Management · acceso</div>
  <input id="lg_mail" type="email" placeholder="Correo">
  <input id="lg_pass" type="password" placeholder="Contraseña">
  <button class="pri" id="lg_go" style="width:100%">Entrar</button>
</div>

<div id="app" style="display:none">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modal" class="modal hidden"><div class="box" id="box"></div></div>
<div id="print"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="rangos.js"></script>
<script src="calc.js"></script>
<script src="app.js"></script>
<script src="modulos.js"></script>
</body>
</html>
